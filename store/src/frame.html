<!doctype html>
<!--
  Plain app screenshot without caption or phone frame (README screenshots), 360x760 CSS px.
  The fixed-size iframe keeps the app at phone width even if the headless window is wider.
  Query: ?tab=...&theme=...
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; overflow: hidden; background: #111; }
  iframe { width: 360px; height: 760px; border: 0; display: block; }
</style>
<iframe id="screen"></iframe>
<script>
  document.getElementById('screen').src = 'shot.html' + location.search;
</script>
