<!doctype html>
<!--
  Phone screenshot with a caption, rendered at 540x960 CSS px x2 = 1080x1920.
  Query: ?tab=...&theme=...&title=...&sub=...
-->
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 540px; height: 960px; overflow: hidden; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(120% 70% at 20% 0%, #0b6b3f 0%, #004225 55%, #00301b 100%);
    color: #fff;
    text-align: center;
  }
  h1 { margin: 52px 40px 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.5px; }
  p { margin: 12px 48px 0; font-size: 18px; line-height: 1.35; color: rgba(255,255,255,.78); }
  .phone {
    position: absolute; left: 98px; top: 226px;
    width: 344px; height: 704px; box-sizing: border-box;
    border-radius: 40px; background: #050505; padding: 10px; overflow: hidden;
    box-shadow: 0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.08);
  }
  iframe { width: 360px; height: 760px; border: 0; border-radius: 34px; display: block; background: #111;
           transform: scale(.9); transform-origin: 0 0; }
</style>
<h1 id="title"></h1>
<p id="sub"></p>
<div class="phone"><iframe id="screen"></iframe></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('title').textContent = q.get('title') || '';
  document.getElementById('sub').textContent = q.get('sub') || '';
  document.getElementById('screen').src = 'shot.html?tab=' + (q.get('tab') || 'budget') + '&theme=' + (q.get('theme') || 'dark');
</script>
