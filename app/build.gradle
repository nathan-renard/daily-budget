plugins {
    id 'com.android.application'
}

// Upload key for Play Store builds. keystore.properties (repo root, git-ignored) holds
// storeFile / storePassword / keyAlias / keyPassword; create it with tools/create-upload-key.ps1.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'com.aimbire.dailybudget'
    compileSdk 36

    defaultConfig {
        applicationId 'com.aimbire.dailybudget'
        minSdk 26
        targetSdk 36
        // Bump versionCode for every upload to Play (it must always increase).
        versionCode 1
        versionName '1.0'
    }

    signingConfigs {
        if (keystorePropsFile.exists()) {
            upload {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Without keystore.properties, fall back to the debug key so the release APK
            // still installs directly. Play rejects debug-signed bundles.
            signingConfig keystorePropsFile.exists() ? signingConfigs.upload : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pay-what-you-want Pro. Purchases go through the Play Store app on the device.
    implementation('com.android.billingclient:billing:9.1.0') {
        // The library also sends its own usage logs to Google over the network, which is what
        // adds the INTERNET permission. Without this backend it skips them (9.1.0 catches the
        // missing class), and the app stays offline. After upgrading, check the merged manifest.
        exclude group: 'com.google.android.datatransport', module: 'transport-backend-cct'
    }
    // Billing brings in Kotlin; line up the old kotlin-stdlib-jdk7/jdk8 it also pulls in,
    // or their classes clash with kotlin-stdlib's.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
